name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out commit
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.153.0 deploy 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          DEPLOY_URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -n 1)
          if [ -z "$DEPLOY_URL" ]; then
            echo "Could not find workers.dev URL in deploy output"
            exit 1
          fi
          echo "DEPLOY_URL=$DEPLOY_URL" >> "$GITHUB_ENV"
          echo "Deployed to $DEPLOY_URL"

      - name: Smoke-check deployment
        run: |
          set -euo pipefail
          echo "Checking $DEPLOY_URL"
          # Cache-bust: HTML edge-caches for 5 min, so a redeploy's smoke
          # check must not read the previous deployment's cached copy.
          Q="?smoke=$GITHUB_SHA"
          # grep straight into a variable first: `curl | grep -q` trips
          # pipefail (curl exits 23 on grep's early SIGPIPE close).
          body=$(curl --fail --silent --max-time 15 "$DEPLOY_URL/$Q")
          grep -q "TPaulShippy.com" <<<"$body"
          echo "Home page OK"
          body=$(curl --fail --silent --max-time 15 "$DEPLOY_URL/McCain.html$Q")
          grep -q "McCain" <<<"$body"
          echo "Legacy essay OK"
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 15 "$DEPLOY_URL/this-page-does-not-exist-12345$Q")
          if [ "$code" != "404" ]; then
            echo "Expected 404 for missing page, got $code"
            exit 1
          fi
          echo "404 handling OK"
          loc=$(curl --silent --output /dev/null --write-out '%{redirect_url}' --max-time 15 "$DEPLOY_URL/mccain.html$Q")
          case "$loc" in
            */McCain.html*) echo "Legacy alias redirect OK ($loc)" ;;
            *) echo "Legacy alias redirect failed: $loc"; exit 1 ;;
          esac
