name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out commit
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build static blog
        run: |
          set -euo pipefail
          node scripts/build-blog.mjs
          test -f blog/index.html
          test -f blog/feed.xml
          test -f blog/latest.json
          echo "blog pages: $(find blog -name index.html | wc -l)"

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4.153.0 deploy 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          DEPLOY_URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -n 1 || true)
          if [ -z "$DEPLOY_URL" ]; then
            # No-asset-change deploys only list custom-domain triggers, so
            # fall back to the stable workers.dev URL for this worker.
            DEPLOY_URL="https://tpaulshippy-com.pshippy-245.workers.dev"
          fi
          echo "DEPLOY_URL=$DEPLOY_URL" >> "$GITHUB_ENV"
          echo "Deployed to $DEPLOY_URL"

      - name: Smoke-check live site
        run: |
          set -euo pipefail
          # Smoke the canonical custom domain (the user-facing surface).
          # NOTE: the *.workers.dev URL currently returns a Cloudflare-side
          # 1042 for this worker (routing-layer, before worker invocation),
          # so it is not a reliable smoke target. Revisit if that changes.
          LIVE_URL="https://tpaulshippy.com"
          echo "Checking $LIVE_URL (deployed via $DEPLOY_URL)"
          # Cache-bust: HTML edge-caches for 5 min, so a redeploy's smoke
          # check must not read the previous deployment's cached copy.
          Q="?smoke=$GITHUB_SHA"
          # grep straight into a variable first: `curl | grep -q` trips
          # pipefail (curl exits 23 on grep's early SIGPIPE close).
          body=$(curl --fail --silent --max-time 15 "$LIVE_URL/$Q")
          grep -q "TPaulShippy.com" <<<"$body"
          echo "Home page OK"
          body=$(curl --fail --silent --max-time 15 "$LIVE_URL/McCain.html$Q")
          grep -q "McCain" <<<"$body"
          echo "Legacy essay OK"
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 15 "$LIVE_URL/this-page-does-not-exist-12345$Q")
          if [ "$code" != "404" ]; then
            echo "Expected 404 for missing page, got $code"
            exit 1
          fi
          echo "404 handling OK"
          loc=$(curl --silent --output /dev/null --write-out '%{redirect_url}' --max-time 15 "$LIVE_URL/mccain.html$Q")
          case "$loc" in
            */McCain.html*) echo "Legacy alias redirect OK ($loc)" ;;
            *) echo "Legacy alias redirect failed: $loc"; exit 1 ;;
          esac

      - name: Smoke-check blog
        run: |
          set -euo pipefail
          BLOG_URL="https://blog.tpaulshippy.com"
          Q="?smoke=$GITHUB_SHA"
          body=$(curl --fail --silent --max-time 15 "$BLOG_URL/$Q")
          grep -q "Paul's Blog" <<<"$body"
          echo "Blog home OK"
          body=$(curl --fail --silent --max-time 15 "$BLOG_URL/2020/06/15/introduction/$Q")
          grep -q "Introduction" <<<"$body"
          echo "Blog post OK"
          body=$(curl --fail --silent --max-time 15 "$BLOG_URL/latest.json$Q")
          grep -q "building-a-native-ios-app-in-a-day" <<<"$body"
          echo "latest.json OK"
          body=$(curl --fail --silent --max-time 15 "$BLOG_URL/feed/$Q")
          grep -q "<rss" <<<"$body"
          echo "RSS feed OK"
          code=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 15 "$BLOG_URL/wp-login.php$Q")
          if [ "$code" != "301" ]; then
            echo "Expected 301 for retired WP route, got $code"
            exit 1
          fi
          echo "Retired WP routes OK"
