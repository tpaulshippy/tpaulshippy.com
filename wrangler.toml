name = "tpaulshippy-com"
compatibility_date = "2026-10-26"
main = "src/index.js"

[assets]
directory = "./"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "404-page"
# Serve legacy .html URLs directly (200) instead of redirecting to
# extensionless clean URLs — preserves 25 years of indexed/bookmarked URLs.
html_handling = "none"
