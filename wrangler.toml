name = "tpaulshippy-com"
compatibility_date = "2026-10-26"
main = "src/index.js"

# Custom domains (apex + www) attach on every deploy; www redirects to apex.
[[routes]]
pattern = "tpaulshippy.com"
custom_domain = true

[[routes]]
pattern = "www.tpaulshippy.com"
custom_domain = true

[[routes]]
pattern = "blog.tpaulshippy.com"
custom_domain = true

[assets]
directory = "./"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "404-page"
# Serve legacy .html URLs directly (200) instead of redirecting to
# extensionless clean URLs — preserves 25 years of indexed/bookmarked URLs.
html_handling = "none"
